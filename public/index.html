  <!-- Pre-render Route & Auth Guard (Zero Protected UI Flicker / FOUC) -->
  <script>
    (function() {
      try {
        var raw = localStorage.getItem('plash_auth_session_v1');
        var isAuth = false;
        if (raw) {
          var parsed = JSON.parse(raw);
          isAuth = !!(parsed && parsed.isAuthenticated);
        }
        var hash = window.location.hash || '';
        var pathname = window.location.pathname || '';
        if (pathname === '/reset-password' || pathname.startsWith('/reset-password/')) {
          var search = window.location.search ? window.location.search.slice(1) : '';
          var fullFragment = [hash.replace(/^#\/?/, ''), search].filter(Boolean).join('&');
          window.location.replace('/#/reset-password' + (fullFragment ? '?' + fullFragment : ''));
          return;
        }
        var isAuthRoute = !hash || hash === '#/' || hash.startsWith('#/login') || hash.startsWith('#/signup') || hash.startsWith('#/reset-password') || hash.startsWith('#reset-password') || hash.startsWith('#/forgot-password');
        if (!isAuth || isAuthRoute) {
          document.documentElement.classList.add('auth-layout');
          if (document.body) document.body.classList.add('auth-layout');
          else document.addEventListener('DOMContentLoaded', function() {
            if (!isAuth || isAuthRoute) document.body.classList.add('auth-layout');
          });
        }
      } catch (e) {}
    })();
  </script>
